<div class="language-switcher">
  <button 
    *ngFor="let lang of languages" 
    class="language-btn" 
    [class.active]="isActive(lang.code)"
    (click)="changeLanguage(lang.code)"
    [attr.data-lang]="lang.code"
    [attr.aria-label]="'Switch to ' + lang.code + ' language'"
    type="button"
  >
    {{ lang.label }}
  </button>
</div>
