<section class="donation-section" id="support">
  <div class="container">
    <h2 class="donation-title">{{ translations().supportTitle }}</h2>
    <p class="donation-text">
      {{ translations().supportText }}
    </p>
    <div class="donation-buttons">
      <a href="https://www.paypal.com/donate/?hosted_button_id=P49L3AK8RDVMN" class="donation-btn paypal-btn" target="_blank">
        <i class="fab fa-paypal"></i>
        {{ translations().paypal }}
      </a>
      <a href="https://www.buymeacoffee.com/shoky" class="donation-btn coffee-btn" target="_blank">
        <i class="fas fa-coffee"></i>
        {{ translations().coffee }}
      </a>
    </div>
    <p class="supporter-count">{{ translations().thanks }}</p>
  </div>
</section>
