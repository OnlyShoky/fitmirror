[build]
  publish = "dist/fitmirror/browser"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  publish = "dist/fitmirror/browser"
  functions = "netlify/functions"
  port = 8888
  target = "angular"

# Configuración para funciones
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Configuración para SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200